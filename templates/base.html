<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}GapLens AI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="noise"></div><header class="topbar"><a class="brand" href="/"><span class="brand-icon">✳</span> GAP<span class="brand-lens">LENS</span><sup>AI</sup></a>
<nav><a href="/">🚀 Career lab</a><a href="/interview">🎤 Interview arena</a><a href="/tracker">🧃 Application tracker</a></nav></header>
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">⚡ {{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer><span>GAPLENS AI</span> · Less guessing. More getting hired. <span class="footer-star">✦</span></footer>
<script src="{{url_for('static',filename='js/app.js')}}"></script></body></html>
